# BeTracks Keys para Windows: VST3 y la app Standalone (x64), con su instalador.
# - En cada push a main (y a mano): compila, prueba y deja el instalador como artefacto «BeTracksKeys-Windows».
# - Al publicar una versión (etiqueta vX.Y.Z, que coincide con el archivo VERSION): además lo sube a Releases
#   con dos nombres, BeTracksKeys-X.Y.Z-Windows.exe y BeTracksKeys-Windows.exe. El segundo es fijo para que la
#   web enlace siempre a la última: https://github.com/georaura/BetracsecKeys/releases/latest/download/BeTracksKeys-Windows.exe
name: Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # solo para crear la Release al publicar una versión

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Versión
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content VERSION -TotalCount 1).Trim())" >> $env:GITHUB_OUTPUT

      - name: Configurar (el Visual Studio del servidor, x64)
        run: cmake -S . -B build/win -A x64

      - name: Compilar VST3 y Standalone
        run: cmake --build build/win --config Release --target BetracsecKeys_VST3 BetracsecKeys_Standalone --parallel

      - name: Pruebas del núcleo (sin audio de fábrica)
        run: |
          cmake -S tests/windows -B build/wintests -A x64
          cmake --build build/wintests --config Release --parallel
          ctest --test-dir build/wintests -C Release --output-on-failure

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} /DBuildDir="$PWD\build\win\BetracsecKeys_artefacts\Release" installer\windows\BetracsecKeys.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: BeTracksKeys-Windows
          path: |
            installer/windows/Output/*.exe
            build/win/BetracsecKeys_artefacts/Release/VST3/**
            build/win/BetracsecKeys_artefacts/Release/Standalone/*.exe

      - name: Publicar en Releases (solo al publicar una versión)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = "${{ steps.ver.outputs.version }}"
          if ($tag -ne "v$ver") { Write-Error "La etiqueta $tag no coincide con VERSION ($ver)"; exit 1 }
          $src = "installer/windows/Output/BeTracksKeys-$ver-Windows.exe"
          Copy-Item $src "BeTracksKeys-Windows.exe"
          $notes = "BeTracks Keys $ver para Windows 10/11 (64 bits): app y plugin VST3. El instalador no está firmado: Windows avisará («Más información» → «Ejecutar de todas formas»). No incluye sonidos. Software libre (AGPL-3.0); aviso legal en docs/LEGAL.md."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $src "BeTracksKeys-Windows.exe" --clobber }
          else { gh release create $tag $src "BeTracksKeys-Windows.exe" --title "BeTracks Keys $ver" --notes $notes }
